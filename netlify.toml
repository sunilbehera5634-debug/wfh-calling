[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/meta-purchase"
  to = "/.netlify/functions/meta-purchase"
  status = 200
  force = true

[[redirects]]
  from = "/api/proxy-sheets"
  to = "https://script.google.com/macros/s/AKfycbxMZRi_BZn827YRJ92sSxP8Mfy1ZC8-p57dIULk0w6kGXO3e4NDa_0kmhnL4qbXYxov/exec"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
